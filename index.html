<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess The Secret | Fabbeiru</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script defer src="script.js"></script>
  <meta name="description"
    content="Adivina la palabra secreta en este divertido juego de adivinanzas. ¡Diviértete y pon a prueba tus habilidades!">
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">

  <header
    class="w-full py-4 bg-gray-800 text-center text-2xl font-bold shadow-md flex justify-between items-center px-6 sm:px-10">
    <span class="flex items-center gap-2">
      <img src="favicon.svg" alt="" width="40" height="40" class="rounded">
      Guess The Secret
    </span>
    <button
      id="resetBtn"
      title="Volver a inicio"
      aria-label="Reiniciar juego"
      class="text-xl leading-none">
      <i class="fa fa-redo"></i>
    </button>
  </header>

  <main class="flex flex-col items-center justify-center flex-1 p-4">

    <div id="setupModal" role="dialog" aria-modal="true" aria-labelledby="setupModalTitle" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
      <div class="bg-gray-800 p-6 rounded-xl w-full max-w-md space-y-4">
        <h2 id="setupModalTitle" class="text-xl font-bold">Configurar Juego</h2>
        
        <div>
          <label for="wordInput" class="block text-sm">Secreto:</label>
          <input
            id="wordInput"
            type="text"
            class="w-full mt-1 p-2 rounded bg-gray-700 text-white"
            autocomplete="off" />
          <span id="wordError" class="hidden">Este campo es obligatorio.</span>
        </div>
        
        <div>
          <label for="hintInput" class="block text-sm">Pista:</label>
          <textarea
            id="hintInput"
            rows="2"
            class="w-full mt-1 p-2 rounded bg-gray-700 text-white"
            autocomplete="off"></textarea>
          <span id="hintError" class="hidden">Este campo es obligatorio.</span>
        </div>

        <div id="wordHintList" class="space-y-2"></div>

        <div class="flex items-center gap-2 pt-2 border-t border-gray-700">
          <input
            id="strictAccentsCheckbox"
            type="checkbox"
            class="w-4 h-4" />
          <label for="strictAccentsCheckbox" class="text-sm">
            Tratar tildes y "ñ" como letras distintas al adivinar
          </label>
        </div>

        <button
          id="addWordBtn"
          class="w-full bg-gray-700 hover:bg-gray-600 py-2 px-4 rounded text-white"
          aria-label="Añadir Secreto/Pista">Añadir Secreto/Pista</button>

        <button
          id="startGameBtn"
          class="w-full bg-green-600 hover:bg-green-700 py-2 px-4 rounded text-white"
          aria-label="Comenzar Juego">Comenzar Juego</button>
      </div>
    </div>

    <div id="gameArea" class="flex flex-col lg:flex-row items-start justify-center p-4 gap-12 hidden">
      <div class="flex-[2] text-center space-y-6">
        <div class="text-2xl" id="hintDisplay"></div>
        <div id="wordDisplay" class="text-4xl tracking-widest"></div>
        <div id="usedLetters" class="mt-4 text-lg text-gray-400"></div>
        <div id="letterButtons" class="grid grid-cols-6 sm:grid-cols-9 gap-4 mt-8 justify-center"></div>
      </div>

      <div id="sideGuessArea" class="flex-1 w-full max-w-md space-y-2 text-left">
        <label class="text-sm">¿Adivina la palabra/frase completa?</label>
        <div class="flex gap-2">
          <input
            id="fullGuessInput"
            type="text" 
            class="flex-1 p-2 rounded bg-gray-800 text-white border border-gray-600"
            placeholder="Tu adivinanza..." />
          <button
            id="submitGuessBtn"
            class="bg-yellow-600 hover:bg-yellow-700 px-4 rounded text-white"
            aria-label="Probar">Probar</button>
        </div>
        <div class="mt-2 text-sm text-gray-300">
          <strong>Intentos:</strong>
          <ul id="guessHistory" class="list-disc ml-5 space-y-1 mt-1"></ul>
        </div>
      </div>
    </div>

  </main>

  <footer class="flex items-center justify-center gap-2 py-3 bg-gray-800 border-t border-gray-700 text-xs text-gray-400">
    <span>© <span id="footerYear"></span> Fabián Beirutti</span>
    <img src="myLogo.png" alt="Logo de Fabián Beirutti" width="16" height="16" class="rounded">
  </footer>
  <script>document.getElementById('footerYear').textContent = new Date().getFullYear();</script>

  <div id="toastMessage"
    class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-green-600 text-white px-4 py-3 sm:px-8 sm:py-5 rounded-2xl shadow-2xl text-base sm:text-2xl text-center max-w-[85vw] sm:max-w-md opacity-0 transition-opacity duration-500 pointer-events-none z-50">
    🎉 ¡Has adivinado la palabra! 🎉
  </div>

</body>

</html>
